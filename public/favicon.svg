<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3388BB"/>
      <stop offset="100%" stop-color="#1A4A6E"/>
    </linearGradient>
  </defs>
  <!-- 圆角方形背景 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 布谷鸟简化图标：头部 + 身体 + 翅膀 -->
  <g transform="translate(32,34)" fill="#FFFFFF">
    <!-- 身体 -->
    <ellipse cx="0" cy="4" rx="10" ry="11"/>
    <!-- 头部 -->
    <circle cx="0" cy="-8" r="8"/>
    <!-- 眼睛 -->
    <circle cx="-3" cy="-9" r="1.8" fill="#1A4A6E"/>
    <!-- 嘴巴 -->
    <polygon points="4,-6 10,-5 4,-4" fill="#E38043"/>
    <!-- 翅膀 -->
    <path d="M-10,-2 C-18,-2 -20,6 -12,8 C-14,4 -14,-1 -10,-2Z"/>
  </g>
  <!-- 声波线 -->
  <g stroke="#FFD700" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M42,14 C48,8 52,16 46,22"/>
    <path d="M44,12 C52,4 58,16 48,24"/>
  </g>
</svg>
