# ============================================================
# docker-compose.yml
# 布谷工作室 - 生产部署 (Supabase 数据库)
# ============================================================
services:
  # ============================
  # Next.js 应用
  # ============================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bugoo_app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_URL: ${AUTH_URL:-https://yourclub.com}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-bugu-studio}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://yourclub.com}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-布谷工作室}
      NEXT_PUBLIC_CLUB_FOUNDED_YEAR: ${NEXT_PUBLIC_CLUB_FOUNDED_YEAR:-2018}
    volumes:
      - upload_data:/app/public/uploads
    networks:
      - proxy

  # ============================
  # Nginx 反向代理
  # ============================
  nginx:
    image: nginx:alpine
    container_name: bugoo_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./public:/var/www/static:ro
      - upload_data:/var/www/uploads:ro
    networks:
      - proxy

volumes:
  upload_data:
    name: bugoo_upload_data

networks:
  proxy:
    name: bugoo_proxy
